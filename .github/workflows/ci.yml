name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Bundled libraries match package.json
        run: npm run check-libs

      - name: Manifest and script syntax
        run: npm run check-manifest

      - name: Dependency audit (shipped libraries only)
        run: npm run audit
